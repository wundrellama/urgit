# Delivery 1C: the schedules desk/gen/ci-cron-vector.hoon decodes from the
# pinned catalog (schedules.json) and checks against the occurrences the
# compiler computes (occurrences.json): New York's spring-forward and
# fall-back, a zone without daylight saving, a half-hour shift, London,
# the leap day, both day rules, the horizon, and two refused entries.
name: Schedules
on:
  schedule:
    - cron: '30 2 * * *'
      timezone: America/New_York
    - cron: '*/15 2 * * *'
      timezone: America/New_York
    - cron: '0,30 2,3 * * *'
      timezone: America/New_York
    - cron: '0 3 * * *'
      timezone: America/New_York
    - cron: '30 1 * * *'
      timezone: America/New_York
    - cron: '0 2 * * *'
      timezone: America/New_York
    - cron: '30 5 * * 1-5'
      timezone: America/New_York
    - cron: '30 5 * * *'
      timezone: Asia/Kolkata
    - cron: '15 2 * * *'
      timezone: Australia/Lord_Howe
    - cron: '45 1 * * *'
      timezone: Australia/Lord_Howe
    - cron: '15 1 * * *'
      timezone: Europe/London
    - cron: '0 0 29 2 *'
    - cron: '0 0 13 * 5'
    - cron: '0 12 */2 * 1'
    - cron: '0 0 * * *'
      timezone: America/New_York
    - cron: '*/4 * * * *'
    - cron: '0 3 * * *'
      timezone: Mars/Olympus
jobs:
  nightly:
    runs-on: ubuntu-latest
    steps: [{run: echo nightly}]
